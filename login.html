<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catering</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 420px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .login-form button {
            width: 100%;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            min-height: 18px;
        }
        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .links a {
            color: #007bff;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div style="text-align: center; margin-bottom: 16px;">
            <img src="images/vanam.png" alt="Vanam Catering Logo" style="max-width: 140px; height: auto;">
        </div>
        <h2>🍽️ Catering</h2>
        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <div class="error-message" id="error-message"></div>
            <button type="submit" class="btn-primary">Log In</button>
        </form>
        <form id="new-password-form" class="login-form hidden">
            <div class="form-group hidden" id="new-password-email-group">
                <label for="new-password-email">Email</label>
                <input type="email" id="new-password-email" name="new-password-email" autocomplete="email">
            </div>
            <div class="form-group hidden" id="new-password-phone-group">
                <label for="new-password-phone">Phone Number</label>
                <input type="tel" id="new-password-phone" name="new-password-phone" autocomplete="tel" placeholder="+1XXXXXXXXXX">
            </div>
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" name="new-password" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm-new-password">Confirm New Password</label>
                <input type="password" id="confirm-new-password" name="confirm-new-password" autocomplete="new-password">
            </div>
            <div class="error-message" id="new-password-error"></div>
            <button type="submit" class="btn-primary">Set New Password</button>
        </form>
        
    </div>

    <!-- AWS Cognito SDK -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
