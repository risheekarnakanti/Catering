    <script
        src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Direct Thermal Print listener removed - Logic merged into standard buttons
            // Enhanced thermal printer support with ESC/POS commands
            function generateThermalReceipt(orderData) {
                // ESC/POS commands using String.fromCharCode to ensure correct byte values
                const ESC = String.fromCharCode(27);
                const GS = String.fromCharCode(29);
                const LF = String.fromCharCode(10);
                const CR = String.fromCharCode(13);

                let receipt = '';

                // Initialize printer
                receipt += ESC + '@'; // Initialize printer
                receipt += ESC + 'a' + String.fromCharCode(1); // Center alignment

                // Header - Different for each receipt type
                receipt += ESC + '!' + String.fromCharCode(24); // Double height & width
                if (orderData.receiptType === 'KITCHEN ORDER') {
                    receipt += 'KITCHEN ORDER' + LF;
                } else {
                    receipt += (orderData.receiptType || 'CATERING RECEIPT') + LF;
                }
                receipt += ESC + '!' + String.fromCharCode(0); // Normal size
                receipt += '================================' + LF;

                // Order info
                receipt += ESC + 'a' + String.fromCharCode(0); // Left alignment
                receipt += 'Order #: ' + (orderData.orderId || 'N/A') + LF;
                receipt += 'Date: ' + new Date().toLocaleDateString() + LF;
                receipt += 'Time: ' + new Date().toLocaleTimeString() + LF;
                receipt += '--------------------------------' + LF;

                // Customer info
                receipt += 'Customer: ' + (orderData.customerName || 'N/A') + LF;
                if (orderData.customerPhone && orderData.customerPhone !== 'N/A') {
                    receipt += 'Phone: ' + orderData.customerPhone + LF;
                }

                // Delivery details
                if (orderData.receiptType !== 'KITCHEN ORDER' || orderData.deliveryType === 'Delivery') {
                    receipt += '--------------------------------' + LF;
                    receipt += 'DELIVERY INFO:' + LF;
                    receipt += 'Date: ' + (orderData.deliveryDate || 'N/A') + LF;
                    receipt += 'Time: ' + (orderData.deliveryTime || 'N/A') + LF;
                    receipt += 'Type: ' + (orderData.deliveryType || 'Pickup') + LF;
                    if (orderData.deliveryAddress && orderData.deliveryType === 'Delivery') {
                        receipt += 'Address:' + LF;
                        // Split long addresses
                        const address = orderData.deliveryAddress;
                        const maxLineLength = 30;
                        const words = address.split(' ');
                        let currentLine = '';

                        for (const word of words) {
                            if ((currentLine + word).length + 1 <= maxLineLength) {
                                currentLine += (currentLine ? ' ' : '') + word;
                            } else {
                                if (currentLine) receipt += '  ' + currentLine + LF;
                                currentLine = word;
                            }
                        }
                        if (currentLine) receipt += '  ' + currentLine + LF;
                    }
                }
                receipt += '--------------------------------' + LF;

                // Items
                receipt += ESC + '!' + String.fromCharCode(8); // Emphasized
                receipt += 'ITEMS:' + LF;
                receipt += ESC + '!' + String.fromCharCode(0); // Normal

                if (orderData.items && orderData.items.length > 0) {
                    orderData.items.forEach(item => {
                        receipt += (item.itemName || 'Item') + LF;
                        receipt += '  ' + (item.sizeName || '');
                        if (item.spiceLevel && item.spiceLevel !== 'N/A') {
                            receipt += ' (' + item.spiceLevel + ')';
                        }
                        receipt += LF;
                        receipt += '  Qty: ' + (item.quantity || 1) + LF;
                        if (item.instructions) {
                            receipt += '  Note: ' + item.instructions + LF;
                        }
                        receipt += LF;
                    });
                } else {
                    receipt += 'No items extracted' + LF;
                }

                receipt += '--------------------------------' + LF;

                // Pricing
                if (orderData.showPricing !== false && orderData.receiptType !== 'KITCHEN ORDER' && orderData.totalPrice) {
                    receipt += ESC + 'a' + String.fromCharCode(2); // Right alignment
                    if (orderData.subtotal && orderData.subtotal !== orderData.totalPrice) {
                        receipt += 'Subtotal: $' + orderData.subtotal + LF;
                    }
                    if (orderData.discountPercent > 0) {
                        receipt += 'Discount (' + orderData.discountPercent + '%): -$' + (orderData.discountAmount || '0.00') + LF;
                    }
                    receipt += ESC + '!' + String.fromCharCode(24); // Double size
                    receipt += 'TOTAL: $' + orderData.totalPrice + LF;
                    receipt += ESC + '!' + String.fromCharCode(0); // Normal size
                    receipt += '--------------------------------' + LF;
                }

                // Special instructions
                if (orderData.specialInstructions && orderData.specialInstructions !== 'None provided.') {
                    receipt += ESC + 'a' + String.fromCharCode(0); // Left alignment
                    receipt += 'SPECIAL INSTRUCTIONS:' + LF;
                    receipt += orderData.specialInstructions + LF;
                    receipt += '--------------------------------' + LF;
                }

                // Footer
                receipt += ESC + 'a' + String.fromCharCode(1); // Center alignment
                receipt += LF;
                if (orderData.receiptType === 'KITCHEN ORDER') {
                    receipt += '*** KITCHEN COPY ***' + LF;
                } else if (orderData.receiptType === 'CUSTOMER RECEIPT') {
                    receipt += 'Thank you for your order!' + LF;
                } else if (orderData.receiptType === 'FRONT DESK RECEIPT') {
                    receipt += '*** FRONT DESK COPY ***' + LF;
                } else {
                    receipt += 'Thank you for your order!' + LF;
                }
                receipt += LF + LF + LF + LF + LF;

                // Cut
                receipt += GS + 'V' + String.fromCharCode(66) + String.fromCharCode(0);

                // Sanitize receipt to remove non-printable characters (except control codes)
                // This removes emojis and other characters that might cause "garbage" printing
                // unexpected control codes are kept (ESC, GS, etc are < 128)
                // We want to keep 0x00-0x7F.
                // But wait, our UTF-8 encoder will encode multi-byte chars correctly if the printer supported them.
                // Since it likely doesn't, we strip them.
                // However, we must be careful not to strip the control codes we validly added.
                // Regular expression [^\x00-\x7F] matches non-ASCII.

                return receipt.replace(/[^\x00-\x7F]/g, "");
                // Actually, let's keep it simple. If the user wants emojis effectively, we can't.

            }

            function printToThermalPrinter(receiptData) {
                // Option 1: Direct USB/Serial printing (requires browser extension or app)
                if (window.chrome && window.chrome.serial) {
                    printViaWebSerial(receiptData); // ESC/POS
                } else if (window.navigator.usb) {
                    printViaWebUSB(receiptData); // ESC/POS
                } else {
                    // Fallback to browser print with thermal CSS
                    // Always use HTML generator for browser print (NO ESC/POS)
                    const orderData = extractOrderDataFromPage();
                    printViaCSS(orderData); // HTML only
                }
            }

            // Enhanced Web Serial API for Volcora printer
            async function printViaWebSerialAdvanced(receiptData) {
                const baudRates = [115200, 38400, 19200, 9600]; // Try common baud rates, starting with fastest
                let port = null;
                for (let baudRate of baudRates) {
                    try {
                        console.log(`Trying WebSerial with baud rate: ${baudRate}`);
                        port = await navigator.serial.requestPort();
                        // If port is already open, close it first
                        if (port && port.open && port.opened) {
                            try {
                                await port.close();
                            } catch (closeErr) {
                                console.warn('Port close error before open:', closeErr);
                            }
                        }
                        await port.open({
                            baudRate: baudRate,
                            dataBits: 8,
                            parity: 'none',
                            stopBits: 1,
                            flowControl: 'none'
                        });

                        const writer = port.writable.getWriter();
                        // Convert receipt string to bytes (ESC/POS expects bytes)
                        let data;
                        if (window.TextEncoder && typeof TextEncoder === 'function') {
                            // Try to use 'latin1' encoding if available
                            try {
                                data = new TextEncoder('latin1').encode(receiptData);
                            } catch (e) {
                                // Fallback to default (utf-8)
                                data = new TextEncoder().encode(receiptData);
                            }
                        } else {
                            // Fallback: ASCII only
                            data = new Uint8Array([...receiptData].map(c => c.charCodeAt(0)));
                        }
                        const chunkSize = 64;
                        for (let i = 0; i < data.length; i += chunkSize) {
                            const chunk = data.slice(i, i + chunkSize);
                            await writer.write(chunk);
                            await new Promise(resolve => setTimeout(resolve, 50));
                        }
                        await new Promise(resolve => setTimeout(resolve, 500));
                        writer.releaseLock();
                        try {
                            await port.close();
                        } catch (closeErr) {
                            console.warn('Port close error (ignoring as print sent):', closeErr);
                        }
                        alert('✅ Receipt printed successfully!');
                        return true;
                    } catch (error) {
                        console.error(`Serial printing failed with baud rate ${baudRate}:`, error);
                        if (port && port.opened) {
                            try {
                                await port.close();
                            } catch (closeErr) {
                                console.warn('Port close error after failure:', closeErr);
                            }
                        }
                        if (error.name === 'InvalidStateError') {
                            alert('❌ Serial port is already open. Please unplug and replug the printer, then try again.');
                            return false;
                        } else if (error.name === 'NotFoundError') {
                            return false;
                        } else if (error.name === 'SecurityError') {
                            alert('❌ Permission denied.\n\nPlease allow access to the serial device and try again.');
                            return false;
                        }
                        if (baudRate === baudRates[baudRates.length - 1]) {
                            console.log('All baud rates failed');
                            return false;
                        }
                    }
                }
                return false;
            }

            // Keep original for fallback
            async function printViaWebSerial(receiptData) {
                try {
                    const port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 9600 });

                    const writer = port.writable.getWriter();
                    const encoder = new TextEncoder();

                    // Send data in chunks to ensure complete transmission
                    const data = encoder.encode(receiptData);
                    const chunkSize = 64; // Small chunks for better compatibility

                    for (let i = 0; i < data.length; i += chunkSize) {
                        const chunk = data.slice(i, i + chunkSize);
                        await writer.write(chunk);
                        // Small delay between chunks
                        await new Promise(resolve => setTimeout(resolve, 50));
                    }

                    // Ensure all data is sent before closing
                    await new Promise(resolve => setTimeout(resolve, 200));

                    writer.releaseLock();
                    await port.close();

                    window.showNotification && window.showNotification('✅ Receipt printed successfully to thermal printer!', 'success');
                } catch (error) {
                    console.error('Serial printing failed:', error);
                    window.showNotification && window.showNotification('⚠️ Direct printing failed, using fallback method', 'info');
                    printViaCSS(); // Fallback
                }
            }

            // Enhanced Web USB API for Volcora and other thermal printers
            async function printViaWebUSBAdvanced(receiptData) {
                try {
                    console.log('Requesting USB device access...');
                    const device = await navigator.usb.requestDevice({
                        filters: [
                            { vendorId: 0x04b8 }, // Epson
                            { vendorId: 0x0519 }, // Star Micronics
                            { vendorId: 0x1504 }, // Citizen
                            { vendorId: 0x0416 }, // Volcora/Generic thermal printers
                            { vendorId: 0x0483 }, // STMicroelectronics (common for thermal printers)
                            { vendorId: 0x1a86 }, // QinHeng Electronics (CH340 USB-Serial chips)
                        ]
                    });

                    console.log('Device selected:', device);

                    await device.open();

                    // Try different configurations
                    const configs = device.configurations;
                    console.log('Available configurations:', configs.length);

                    for (let config of configs) {
                        try {
                            await device.selectConfiguration(config.configurationValue);

                            // Try different interfaces
                            for (let iface of config.interfaces) {
                                try {
                                    await device.claimInterface(iface.interfaceNumber);

                                    const encoder = new TextEncoder();
                                    const data = encoder.encode(receiptData);

                                    // Find the correct endpoint
                                    const endpoint = iface.alternates[0].endpoints.find(ep => ep.direction === 'out');
                                    if (endpoint) {
                                        console.log(`Using endpoint ${endpoint.endpointNumber}`);

                                        // Send data in chunks
                                        const chunkSize = Math.min(512, endpoint.packetSize || 64);
                                        for (let i = 0; i < data.length; i += chunkSize) {
                                            const chunk = data.slice(i, i + chunkSize);
                                            await device.transferOut(endpoint.endpointNumber, chunk);
                                            await new Promise(resolve => setTimeout(resolve, 50));
                                        }

                                        await device.close();
                                        alert('✅ Receipt printed successfully to Volcora USB thermal printer!');
                                        return true; // Success
                                    }
                                } catch (ifaceError) {
                                    console.log(`Interface ${iface.interfaceNumber} failed:`, ifaceError);
                                }
                            }
                        } catch (configError) {
                            console.log(`Configuration ${config.configurationValue} failed:`, configError);
                        }
                    }

                    throw new Error('No working interface found');

                } catch (error) {
                    console.error('USB printing failed:', error);
                    if (error.name === 'NotFoundError') {
                        // Cancelled by user - return false silently/log
                        return false;
                    } else if (error.name === 'SecurityError') {
                        alert('❌ Permission denied.\\n\\nPlease allow access to the USB device and try again.');
                        return false;
                    } else {
                        // Other errors
                        console.log('USB print generic error', error);
                        return false;
                    }
                }
                return false;
            }

            // Keep original for fallback
            async function printViaWebUSB(receiptData) {
                try {
                    const device = await navigator.usb.requestDevice({
                        filters: [
                            { vendorId: 0x04b8 }, // Epson
                            { vendorId: 0x0519 }, // Star Micronics
                            { vendorId: 0x1504 }, // Citizen
                        ]
                    });

                    await device.open();
                    await device.selectConfiguration(1);
                    await device.claimInterface(0);

                    const encoder = new TextEncoder();
                    const data = encoder.encode(receiptData);

                    // Send in smaller chunks for USB stability
                    const chunkSize = 512;
                    for (let i = 0; i < data.length; i += chunkSize) {
                        const chunk = data.slice(i, i + chunkSize);
                        await device.transferOut(1, chunk);
                        // Small delay between chunks
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }

                    await device.close();

                    window.showNotification && window.showNotification('✅ Receipt printed successfully to USB thermal printer!', 'success');
                } catch (error) {
                    console.error('USB printing failed:', error);
                    window.showNotification && window.showNotification('⚠️ Direct printing failed, using fallback method', 'info');
                    printViaCSS(); // Fallback
                }
            }

            // Fallback: CSS-based printing (works with any printer)
            function printViaCSS(orderData) {
                // Force thermal print mode
                document.body.classList.add('thermal-print');
                // Accept orderData as argument
                const printWindow = window.open('', '_blank', 'width=400,height=600');
                const printContent = generateThermalHTML(orderData);
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Thermal Receipt</title>
                        <style>
                            @page {
                                size: 80mm auto;
                                margin: 2mm;
                            }
                            body {
                                font-family: 'Courier New', monospace;
                                font-size: 11px;
                                line-height: 1.2;
                                width: 72mm;
                                margin: 0;
                                padding: 2mm;
                                background: #fff;
                                color: #000;
                            }
                            .header {
                                text-align: center;
                                font-size: 14px;
                                font-weight: bold;
                                text-transform: uppercase;
                                margin: 5px 0;
                                border-bottom: 1px dashed #000;
                                padding-bottom: 3px;
                            }
                            .separator {
                                border-bottom: 1px dashed #000;
                                margin: 5px 0;
                                padding: 2px 0;
                            }
                            .section-title {
                                font-weight: bold;
                                font-size: 11px;
                                text-transform: uppercase;
                                margin: 8px 0 3px 0;
                            }
                            .item {
                                margin: 3px 0;
                                font-size: 10px;
                            }
                            .total {
                                font-size: 14px;
                                font-weight: bold;
                                text-align: right;
                                margin: 8px 0;
                            }
                            .footer {
                                text-align: center;
                                margin: 10px 0;
                                font-size: 10px;
                            }
                            .right-align {
                                text-align: right;
                            }
                            .center-align {
                                text-align: center;
                            }
                            * {
                                max-width: 72mm;
                                word-wrap: break-word;
                                overflow-wrap: break-word;
                            }
                        </style>
                    </head>
                    <body>
                        ${printContent}
                    </body>
                    </html>
                `);
                printWindow.document.close();
                setTimeout(() => {
                    printWindow.print();
                    setTimeout(() => {
                        printWindow.close();
                        document.body.classList.remove('thermal-print');
                    }, 1000);
                }, 500);
            }

            // Generate HTML content for thermal printing
            function generateThermalHTML(orderData) {
                let html = '';

                // Header - Different for each receipt type
                if (orderData.receiptType === 'KITCHEN ORDER') {
                    html += '<div class="header">KITCHEN ORDER</div>';
                } else {
                    html += `<div class="header">${orderData.receiptType || 'CATERING RECEIPT'}</div>`;
                }
                html += '<div class="separator">================================</div>';

                // Order info
                html += `<div>Order #: ${orderData.orderId}</div>`;
                html += `<div>Date: ${new Date().toLocaleDateString()}</div>`;
                html += `<div>Time: ${new Date().toLocaleTimeString()}</div>`;
                html += '<div class="separator">--------------------------------</div>';

                // Customer info
                html += `<div>Customer: ${orderData.customerName}</div>`;
                if (orderData.customerPhone) {
                    html += `<div>Phone: ${orderData.customerPhone}</div>`;
                }

                // Delivery details (show for all except kitchen if needed)
                if (orderData.receiptType !== 'KITCHEN ORDER' || orderData.deliveryType === 'Delivery') {
                    html += '<div class="separator">--------------------------------</div>';
                    html += '<div class="section-title">DELIVERY INFO:</div>';
                    html += `<div>Date: ${orderData.deliveryDate || 'N/A'}</div>`;
                    html += `<div>Time: ${orderData.deliveryTime || 'N/A'}</div>`;
                    html += `<div>Type: ${orderData.deliveryType || 'Pickup'}</div>`;
                    if (orderData.deliveryAddress && orderData.deliveryType === 'Delivery') {
                        html += '<div>Address:</div>';
                        // Break long addresses
                        const address = orderData.deliveryAddress;
                        const maxLineLength = 30;
                        const words = address.split(' ');
                        let currentLine = '';

                        for (const word of words) {
                            if ((currentLine + word).length <= maxLineLength) {
                                currentLine += (currentLine ? ' ' : '') + word;
                            } else {
                                if (currentLine) html += `<div>  ${currentLine}</div>`;
                                currentLine = word;
                            }
                        }
                        if (currentLine) html += `<div>  ${currentLine}</div>`;
                    }
                }
                html += '<div class="separator">--------------------------------</div>';

                // Items
                html += '<div class="section-title">ITEMS:</div>';
                orderData.items.forEach(item => {
                    html += `<div class="item"><strong>${item.itemName}</strong></div>`;
                    html += `<div class="item">  ${item.sizeName}`;
                    if (item.spiceLevel && item.spiceLevel !== 'N/A') {
                        html += ` (${item.spiceLevel})`;
                    }
                    html += '</div>';
                    html += `<div class="item">  Qty: ${item.quantity}</div>`;
                    if (item.instructions) {
                        // Break long instructions
                        const instructions = item.instructions;
                        const maxLineLength = 28;
                        const words = instructions.split(' ');
                        let currentLine = '';

                        html += '<div class="item">  Note: ';
                        for (const word of words) {
                            if ((currentLine + word).length <= maxLineLength) {
                                currentLine += (currentLine ? ' ' : '') + word;
                            } else {
                                if (currentLine) html += `${currentLine}<br>        `;
                                currentLine = word;
                            }
                        }
                        if (currentLine) html += currentLine;
                        html += '</div>';
                    }
                    html += '<div style="margin: 3px 0;"></div>';
                });

                html += '<div class="separator">--------------------------------</div>';

                // Pricing (hide completely for kitchen receipts)
                if (orderData.showPricing !== false && orderData.receiptType !== 'KITCHEN ORDER' && orderData.totalPrice) {
                    if (orderData.subtotal && orderData.subtotal !== orderData.totalPrice && orderData.subtotal !== '') {
                        html += `<div class="right-align">Subtotal: $${orderData.subtotal}</div>`;
                    }
                    if (orderData.discountPercent > 0 && orderData.discountAmount) {
                        html += `<div class="right-align">Discount (${orderData.discountPercent}%): -$${orderData.discountAmount}</div>`;
                    }
                    html += `<div class="total">TOTAL: $${orderData.totalPrice}</div>`;
                    html += '<div class="separator">--------------------------------</div>';
                } else if (orderData.receiptType === 'KITCHEN ORDER') {
                    console.log('Browser print - Kitchen receipt: No pricing information included');
                }

                // Special instructions
                if (orderData.specialInstructions) {
                    html += '<div class="section-title">SPECIAL INSTRUCTIONS:</div>';
                    // Break long instructions
                    const instructions = orderData.specialInstructions;
                    const maxLineLength = 32;
                    const words = instructions.split(' ');
                    let currentLine = '';

                    for (const word of words) {
                        if ((currentLine + word).length <= maxLineLength) {
                            currentLine += (currentLine ? ' ' : '') + word;
                        } else {
                            if (currentLine) html += `<div>${currentLine}</div>`;
                            currentLine = word;
                        }
                    }
                    if (currentLine) html += `<div>${currentLine}</div>`;
                    html += '<div class="separator">--------------------------------</div>';
                }

                // Footer
                html += '<div class="footer">';
                if (orderData.receiptType === 'KITCHEN ORDER') {
                    html += '*** KITCHEN COPY ***<br>Prepare this order';
                } else if (orderData.receiptType === 'CUSTOMER RECEIPT') {
                    html += 'Thank you for your order!<br>Please keep this receipt';
                } else if (orderData.receiptType === 'FRONT DESK RECEIPT') {
                    html += '*** FRONT DESK COPY ***<br>Order management record';
                } else {
                    html += 'Thank you for your order!';
                }
                html += '</div>';

                return html;
            }

            async function handlePrint(mode) {
                console.log('=== HANDLE PRINT CALLED ===');
                console.log('Print mode:', mode);

                // Get current order data from the page
                const orderData = extractOrderDataFromPage();

                // Customize receipt content based on print type
                if (mode === 'kitchen') {
                    orderData.showPricing = false; // Hide pricing for kitchen
                    orderData.receiptType = 'KITCHEN ORDER';
                    // Completely remove pricing data for kitchen receipts
                    orderData.totalPrice = '';
                    orderData.subtotal = '';
                    orderData.discountAmount = '';
                    orderData.discountPercent = 0;
                } else if (mode === 'customer') {
                    orderData.showPricing = true;
                    orderData.receiptType = 'CUSTOMER RECEIPT';
                } else if (mode === 'frontdesk') {
                    orderData.showPricing = true;
                    orderData.receiptType = 'FRONT DESK RECEIPT';
                } else {
                    orderData.showPricing = true;
                    orderData.receiptType = 'CATERING RECEIPT';
                }

                console.log('Final orderData after mode customization:', orderData);
                console.log('Receipt type set to:', orderData.receiptType);
                console.log('Show pricing set to:', orderData.showPricing);

                // Try Thermal Print First
                if (navigator.serial || navigator.usb) {
                    const receiptData = generateThermalReceipt(orderData); // ESC/POS
                    let success = false;

                    if (navigator.serial) {
                        try {
                            success = await printViaWebSerialAdvanced(receiptData);
                        } catch (e) {
                            console.log('Serial print attempt failed:', e);
                        }
                    }

                    if (!success && navigator.usb) {
                        try {
                            success = await printViaWebUSBAdvanced(receiptData);
                        } catch (e) {
                            console.log('USB print attempt failed:', e);
                        }
                    }

                    if (success) {
                        console.log('Thermal print successful, no fallback needed.');
                        return;
                    } else {
                        console.log('Thermal print failed or was not supported/selected, falling back to browser print.');
                    }
                }

                // Fallback to Browser Print: use HTML generator only (NO ESC/POS)
                printViaCSS(orderData);
            }

            function extractOrderDataFromPage() {
                // Parse Order ID
                let orderId = 'N/A';
                const orderIdHeader = document.querySelector('.order-details-pricing-block h2') || document.querySelector('h2');
                if (orderIdHeader) {
                    orderId = orderIdHeader.textContent.replace('Order #', '').trim();
                }

                // Parse Customer Details using new IDs and Classes
                let customerName = 'N/A', customerPhone = '', customerEmail = '';
                const customerSection = document.getElementById('customer-details-section');
                if (customerSection) {
                    const nameEl = customerSection.querySelector('.customer-name');
                    const phoneEl = customerSection.querySelector('.customer-phone');
                    const emailEl = customerSection.querySelector('.customer-email');

                    if (nameEl) customerName = nameEl.textContent.trim();
                    if (phoneEl) customerPhone = phoneEl.textContent.trim();
                    if (emailEl) customerEmail = emailEl.textContent.trim();
                }

                // Parse Delivery Details
                let deliveryDate = '', deliveryTime = '', deliveryType = 'Pickup', deliveryAddress = '';
                const deliverySection = document.getElementById('delivery-details-section');
                if (deliverySection) {
                    const dateEl = deliverySection.querySelector('.delivery-date');
                    const timeEl = deliverySection.querySelector('.delivery-time');
                    const typeEl = deliverySection.querySelector('.delivery-type');
                    const addressEl = deliverySection.querySelector('.delivery-address');

                    if (dateEl) deliveryDate = dateEl.textContent.trim();
                    if (timeEl) deliveryTime = timeEl.textContent.trim();
                    if (typeEl) deliveryType = typeEl.textContent.trim();
                    if (addressEl) deliveryAddress = addressEl.textContent.trim();
                }

                // Parse Items
                const items = [];
                const itemsSection = document.getElementById('items-section');
                if (itemsSection) {
                    const listItems = itemsSection.querySelectorAll('li');
                    listItems.forEach(li => {
                        // Use text content parsing as backup since we didn't add structured wrappers to list items yet
                        // Format: <b>Item Name</b> (Qty Size, Spice) details...
                        const boldEl = li.querySelector('b');
                        if (boldEl) {
                            const itemName = boldEl.textContent.trim();
                            // Get text after bold element
                            let detailsText = li.textContent.replace(itemName, '').trim();
                            // Remove parens if they exist at start/end
                            if (detailsText.startsWith('(')) detailsText = detailsText.substring(1);
                            if (detailsText.indexOf(')') > 0) detailsText = detailsText.substring(0, detailsText.indexOf(')'));

                            // Extract quantity from details "1 Tray" or "10"
                            let quantity = 1;
                            let sizeName = '';
                            let spiceLevel = 'N/A';

                            const parts = detailsText.split(',');
                            const firstPart = parts[0].trim(); // "1 Tray" or "1"

                            const qtyMatch = firstPart.match(/(\d+)\s*(.*)/);
                            if (qtyMatch) {
                                quantity = parseInt(qtyMatch[1]) || 1;
                                sizeName = qtyMatch[2].trim(); // "Tray" or ""
                            }

                            if (parts.length > 1) {
                                spiceLevel = parts[1].trim();
                            }

                            // Instructions
                            let instructions = '';
                            const smallEl = li.querySelector('small');
                            if (smallEl) {
                                instructions = smallEl.textContent.replace('📝 ', '').trim();
                            }

                            items.push({
                                itemName,
                                sizeName,
                                spiceLevel,
                                quantity,
                                instructions
                            });
                        }
                    });
                }

                // Parse Pricing
                let totalPrice = '0.00', subtotal = '0.00', discountAmount = '0.00', discountPercent = 0;
                const pricingBlock = document.querySelector('.order-details-pricing-block');
                if (pricingBlock) {
                    const totalEl = pricingBlock.querySelector('.order-details-price');
                    if (totalEl) totalPrice = totalEl.textContent.replace('$', '').trim();

                    // Try to find subtotal/discount from pricing section
                    const pricingSection = pricingBlock.querySelector('.order-details-pricing');
                    if (pricingSection) {
                        const pricePs = pricingSection.querySelectorAll('p');
                        pricePs.forEach(p => {
                            if (p.textContent.includes('Subtotal:')) {
                                subtotal = p.querySelector('span').textContent.replace('$', '').trim();
                            }
                            if (p.textContent.includes('Discount')) {
                                const discText = p.querySelector('span').textContent.replace('-$', '').trim();
                                discountAmount = discText;
                                const percentMatch = p.textContent.match(/\((\d+)%\)/);
                                if (percentMatch) discountPercent = parseInt(percentMatch[1]);
                            }
                        });
                    }
                }
                if (subtotal === '0.00') subtotal = totalPrice;

                // Parse Special Instructions
                let specialInstructions = '';
                const instructionsSection = document.getElementById('instructions-section');
                if (instructionsSection) {
                    const textEl = instructionsSection.querySelector('.special-instructions-text');
                    if (textEl) specialInstructions = textEl.textContent.trim();
                }

                console.log('Extracted Data:', { orderId, customerName, items, totalPrice });

                return {
                    orderId,
                    customerName,
                    customerPhone,
                    customerEmail,
                    deliveryDate,
                    deliveryTime,
                    deliveryType,
                    deliveryAddress,
                    items,
                    subtotal,
                    discountPercent,
                    discountAmount,
                    totalPrice,
                    specialInstructions
                };
            }

            // Add event listeners
            const frontdeskBtn = document.getElementById('print-frontdesk-btn');
            const customerBtn = document.getElementById('print-customer-btn');
            const kitchenBtn = document.getElementById('print-kitchen-btn');

            if (frontdeskBtn) {
                frontdeskBtn.addEventListener('click', function () {
                    handlePrint('frontdesk');
                });
            }
            if (customerBtn) {
                customerBtn.addEventListener('click', function () {
                    handlePrint('customer');
                });
            }
            if (kitchenBtn) {
                kitchenBtn.addEventListener('click', function () {
                    console.log('Kitchen button clicked - calling handlePrint with kitchen mode');
                    handlePrint('kitchen');
                });
            }
        });
    </script>
